<header class="nav-wrap">

    <nav class="nav">

        <a class="brand" routerLink="/" (click)="closeMenu()">
            <span class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 7v5l3 2"/>
                </svg>
            </span>
            <span>ShiftLess</span>
        </a>

        <button
            class="burger"
            type="button"
            aria-label="Toggle menu"
            [attr.aria-expanded]="menuOpen()"
            (click)="toggleMenu()">
            <span></span><span></span><span></span>
        </button>

        <div class="nav-links" [class.open]="menuOpen()">

            @for (link of links(); track link.path) {
                <a
                    [routerLink]="link.path"
                    routerLinkActive="active"
                    (click)="closeMenu()">
                    {{ link.label }}
                </a>
            }

            <div class="nav-spacer"></div>

            @if (isLoggedIn()) {

                @if (displayName()) {
                    <span class="greet">Hi, <strong>{{ displayName() }}</strong></span>
                }

                <span class="role-pill">{{ roleLabel() }}</span>

                <button type="button" class="btn-logout" (click)="logout()">Log out</button>

            } @else {

                <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Log in</a>

                <a class="btn-cta" routerLink="/register" (click)="closeMenu()">Get started</a>

            }

        </div>

    </nav>

</header>
