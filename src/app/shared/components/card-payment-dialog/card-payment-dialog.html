<div class="pay-backdrop" (click)="close()"></div>

<div
    class="pay-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="payTitle">

    <div class="pay-header">

        <div>

            <h5 id="payTitle" class="mb-0">
                Pay for "{{ taskTitle }}"
            </h5>

            <small class="text-muted">
                Demo payment. No real money moves.
            </small>

        </div>

        <button
            type="button"
            class="btn-close"
            aria-label="Close"
            (click)="close()"
            [disabled]="processing">
        </button>

    </div>

    <div
        *ngIf="success"
        class="text-center py-4">

        <div class="pay-check">&#10003;</div>

        <h5 class="mt-3">Payment successful</h5>

        <p class="text-muted mb-1">
            &#8377;{{ amount | number:'1.0-2' }} paid
        </p>

        <small class="text-muted">
            Transaction {{ transactionId }}
        </small>

        <div class="mt-3">

            <button
                type="button"
                class="btn btn-success"
                (click)="finish()">

                Done

            </button>

        </div>

    </div>

    <form
        *ngIf="!success"
        [formGroup]="form"
        (ngSubmit)="submit()"
        novalidate>

        <div
            *ngIf="errorMessage"
            class="alert alert-danger py-2">

            {{ errorMessage }}

        </div>

        <div class="mb-3">

            <label class="form-label">Name on card</label>

            <input
                class="form-control"
                autocomplete="cc-name"
                formControlName="cardholderName">

            <small
                class="text-danger"
                *ngIf="form.controls.cardholderName.invalid && form.controls.cardholderName.touched">

                Enter the name on the card.

            </small>

        </div>

        <div class="mb-3">

            <label class="form-label">Card number</label>

            <input
                class="form-control"
                inputmode="numeric"
                autocomplete="cc-number"
                placeholder="4242 4242 4242 4242"
                formControlName="cardNumber"
                (input)="onCardNumberInput($event)">

            <small
                class="text-danger"
                *ngIf="form.controls.cardNumber.invalid && form.controls.cardNumber.touched">

                Enter a valid card number.

            </small>

        </div>

        <div class="row">

            <div class="col-6 mb-3">

                <label class="form-label">Expiry</label>

                <input
                    class="form-control"
                    inputmode="numeric"
                    autocomplete="cc-exp"
                    placeholder="MM/YY"
                    formControlName="expiry"
                    (input)="onExpiryInput($event)">

                <small
                    class="text-danger"
                    *ngIf="form.controls.expiry.invalid && form.controls.expiry.touched">

                    Use MM/YY.

                </small>

            </div>

            <div class="col-6 mb-3">

                <label class="form-label">Security code</label>

                <input
                    class="form-control"
                    inputmode="numeric"
                    maxlength="4"
                    autocomplete="cc-csc"
                    placeholder="123"
                    formControlName="cvv">

                <small
                    class="text-danger"
                    *ngIf="form.controls.cvv.invalid && form.controls.cvv.touched">

                    3 or 4 digits.

                </small>

            </div>

        </div>

        <button
            type="submit"
            class="btn btn-primary w-100"
            [disabled]="processing">

            <span
                *ngIf="processing"
                class="spinner-border spinner-border-sm me-2">
            </span>

            {{ processing ? 'Processing...' : 'Pay ₹' + (amount | number:'1.0-2') }}

        </button>

        <div class="test-cards mt-3">

            <div class="small fw-bold mb-2">
                Developer test cards (click to fill)
            </div>

            <button
                type="button"
                class="test-card-btn"
                *ngFor="let card of testCards"
                (click)="fillTestCard(card)">

                <span>{{ card.number }}</span>

                <span class="text-muted">{{ card.outcome }}</span>

            </button>

        </div>

    </form>

</div>
