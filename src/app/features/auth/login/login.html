<div class="auth-page">

    <div class="auth-shell">

        <aside class="auth-aside">

            <a class="auth-logo" routerLink="/">
                <span class="auth-logo-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
                    </svg>
                </span>
                ShiftLess
            </a>

            <div>
                <h2>Shifts sorted.<br>Chats instant.</h2>

                <ul class="auth-points">
                    <li>Post tasks and review applicants</li>
                    <li>Real-time notifications</li>
                    <li>A built-in chat for every task</li>
                </ul>
            </div>

            <div class="auth-demo" aria-hidden="true">
                <div class="demo-bubble in">Cleaner &#183; user1: hy</div>
                <div class="demo-bubble out">On my way!</div>
            </div>

        </aside>

        <div class="auth-main">

            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-sub">Log in to manage your shifts and conversations.</p>

            <div
                *ngIf="errorMessage"
                class="alert alert-danger">

                {{ errorMessage }}

            </div>

            <form
                [formGroup]="loginForm"
                (ngSubmit)="login()">

                <div class="field">

                    <label for="email">Email</label>

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>
                        </svg>

                        <input
                            id="email"
                            class="form-control"
                            type="email"
                            autocomplete="email"
                            placeholder="you@example.com"
                            formControlName="email">

                    </div>

                </div>

                <div class="field">

                    <label for="password">Password</label>

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>

                        <input
                            id="password"
                            class="form-control"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Your password"
                            formControlName="password">

                    </div>

                </div>

                <button
                    class="btn btn-brand w-100 mt-2"
                    type="submit"
                    [disabled]="submitting">

                    {{ submitting ? 'Logging in...' : 'Log in' }}

                </button>

            </form>

            <p class="auth-foot">

                New to ShiftLess?

                <a routerLink="/register">Create an account</a>

            </p>

        </div>

    </div>

</div>
