<div class="container py-5">

    <h2 class="mb-2">
        Manager Dashboard

    <p class="text-muted mb-5">

    </p>

    <div class="row g-4">

        <div class="col-lg-6">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h4>Create Task</h4>

                    <p>Create a new task request.</p>
                    <a
                    
                        routerLink="/manager/create-task"
                        class="btn btn-primary">

                        Create

                    </a>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow-sm h-100">

                    <a
                        routerLink="/manager/my-tasks"
                        class="btn btn-success">

                    </a>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h4>Applicants</h4>

                    <p>Review worker applications across all your tasks.</p>
                    <a
                    
                        routerLink="/manager/applicants"
                        class="btn btn-info">

                    </a>

                </div>

            </div>

        <div class="col-lg-6">

        </div>
