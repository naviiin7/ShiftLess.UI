<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="mb-0">

            Applicants

        </h2>

        <span class="badge bg-secondary">

            {{ applicants.length }} Applicant(s)

        </span>

    </div>

    <div
        *ngIf="loading"
        class="text-center py-5">

        <div class="spinner-border text-primary"></div>

        <p class="mt-3">

            Loading applicants...

        </p>

    </div>

    <div
        *ngIf="errorMessage"
        class="alert alert-danger">

        {{ errorMessage }}

    </div>

    <div
        *ngIf="!loading && applicants.length === 0"
        class="alert alert-info">

        No applicants yet.

    </div>

    <div
        *ngIf="!loading && applicants.length > 0"
        class="table-responsive">

        <table class="table table-hover align-middle">

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Status</th>

                    <th class="text-end">

                        Actions

                    </th>

                </tr>

            </thead>

            <tbody>

                <tr
                    *ngFor="let applicant of applicants">

                    <td>

                        {{ applicant.fullName }}

                    </td>

                    <td>

                        {{ applicant.email }}

                    </td>

                    <td>

                        <span
                            class="badge"
                            [ngClass]="{

                                'bg-warning text-dark': applicant.status === 'Pending',

                                'bg-success': applicant.status === 'Accepted',

                                'bg-danger': applicant.status === 'Rejected'

                            }">

                            {{ applicant.status }}

                        </span>

                    </td>

                    <td class="text-end">

                        <button
                            class="btn btn-success btn-sm me-2"
                            (click)="accept(applicant.applicationId)"
                            [disabled]="applicant.status !== 'Pending'">

                            Accept

                        </button>

                        <button
                            class="btn btn-danger btn-sm"
                            (click)="reject(applicant.applicationId)"
                            [disabled]="applicant.status !== 'Pending'">

                            Reject

                    </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
