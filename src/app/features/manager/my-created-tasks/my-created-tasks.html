<div class="container py-5">

    <h2 class="mb-2">
        My Created Tasks
    </h2>

    <p class="text-muted mb-4">
        Manage the tasks you've published.
    </p>

    <div
        *ngIf="loading"
        class="text-center py-5">

        <div class="spinner-border text-primary"></div>

        <p class="mt-3">
            Loading tasks...
        </p>

    </div>

    <div
        *ngIf="!loading && tasks.length === 0"
        class="alert alert-info">

        You haven't created any tasks yet.

    </div>

    <div
        class="card shadow-sm mb-3"
        *ngFor="let task of tasks">

        <div class="card-body">

            <div class="d-flex justify-content-between">

                <div>

                    <h4>{{ task.title }}</h4>

                    <p class="text-muted mb-1">
                        {{ task.description }}
                    </p>

                    <small class="text-muted">

                        {{ task.acceptedWorkers ?? 0 }} / {{ task.requiredWorkers }} workers filled

                    </small>

                </div>

                <span
                    class="badge align-self-start"
                    [ngClass]="{

                        'bg-primary': task.status === 'Open',

                        'bg-warning text-dark': task.status === 'Full',

                        'bg-info': task.status === 'InProgress',

                        'bg-success': task.status === 'Completed',

                        'bg-danger': task.status === 'Cancelled' || task.status === 'Expired'

                    }">

                    {{ task.status === 'Full' ? 'Assigned' : task.status }}

                </span>

            </div>

            <hr>

            <div class="d-flex gap-2 flex-wrap">

                <a
                    class="btn btn-primary"
                    [routerLink]="['/manager/task-details', task.taskId]">

                    View Details

                </a>

                <button
                    class="btn btn-danger"
                    (click)="delete(task.taskId)">

                    Delete

                </button>

            </div>

        </div>

    </div>

</div>
