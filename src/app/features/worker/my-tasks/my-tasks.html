<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>My Tasks</h2>

        <button
            class="btn btn-outline-primary"
            (click)="load()">

            Refresh

        </button>

    </div>

    <div
        *ngIf="loading"
        class="text-center my-5">

        <div class="spinner-border text-primary"></div>

        <p class="mt-3">
            Loading your tasks...
        </p>

    </div>

    <div
        *ngIf="errorMessage"
        class="alert alert-danger">

        {{ errorMessage }}

    </div>

    <div
        *ngIf="successMessage"
        class="alert alert-success">

        {{ successMessage }}

    </div>

    <div
        *ngIf="!loading && tasks.length === 0"
        class="alert alert-info">

        You haven't been assigned to any tasks yet.

    </div>

    <div class="row">

        <div
            class="col-lg-6 mb-4"
            *ngFor="let task of tasks">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-start">

                        <h4>{{ task.title }}</h4>

                        <span
                            class="badge"
                            [ngClass]="{

                                'bg-warning text-dark': task.status === 'Full',

                                'bg-primary': task.status === 'Open',

                                'bg-info': task.status === 'InProgress',

                                'bg-success': task.status === 'Completed',

                                'bg-danger': task.status === 'Cancelled' || task.status === 'Expired'

                            }">

                            {{ task.status === 'Full' ? 'Assigned' : task.status }}

                        </span>

                    </div>

                    <p>{{ task.description }}</p>

                    <hr>

                    <p>

                        <strong>Budget:</strong>

                        ₹{{ task.budget }}

                    </p>

                    <p>

                        <strong>Start Time:</strong>

                        {{ task.deadline | date:'medium' }}

                    </p>

                    <button
                        class="btn btn-outline-danger w-100"
                        (click)="leave(task.taskId)"
                        [disabled]="leavingTaskId === task.taskId || !canLeave(task)">

                        <span *ngIf="leavingTaskId === task.taskId">

                            Leaving...

                        </span>

                        <span *ngIf="leavingTaskId !== task.taskId">

                            Leave Task

                        </span>

                    </button>

                    <button
                        class="btn btn-outline-primary w-100 mt-2"
                        (click)="toggleChat(task.taskId)">

                        {{ openChatTaskId === task.taskId ? 'Hide Chat' : 'Chat' }}

                    </button>

                    <div
                        *ngIf="openChatTaskId === task.taskId"
                        class="mt-3">

                        <app-chat-widget [taskId]="task.taskId"></app-chat-widget>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
